name: RAGAS evaluation gate

# Runs the golden-set eval (eval/run_eval.py) against real Claude for
# generation -- not the local Ollama setup used in day-to-day dev, since a
# hosted runner can't reasonably run a local LLM in CI time. Embeddings run
# locally in-process (sentence_transformers) rather than through a hosted
# API -- free, no key, no rate limits, and the cross-encoder reranker
# already pulls in the same library. Requires ANTHROPIC_API_KEY and
# DATABASE_URL as repository secrets.
#
# Fails the build if mean faithfulness or mean answer_relevancy drops below
# the thresholds in eval/run_eval.py -- e.g. reverting to dense-only
# retrieval or breaking the reranker trips this gate.
#
# Scoped to the exact modules eval/run_eval.py actually imports (chunking,
# embed_store, hybrid_store, orchestrator, which pulls in llm/grounding, and
# pgvector_store via hybrid_store) -- not all of src/**. api.py, db.py,
# auth.py, and query.py are never imported by the eval script, directly or
# transitively, so a change confined to those files can't be validated by
# this suite; it would just spend ~300-500 real Claude calls (42 questions x
# several pipeline calls, plus RAGAS's own scoring) checking nothing. Those
# files still need deploying, though -- see deploy.yml's own direct path
# trigger.

on:
  push:
    branches: [main]
    paths: &eval-relevant-paths
      - "src/chunking.py"
      - "src/embed_store.py"
      - "src/hybrid_store.py"
      - "src/pgvector_store.py"
      - "src/orchestrator.py"
      - "src/llm.py"
      - "src/grounding.py"
      - "eval/**"
      - "db/schema.sql"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths: *eval-relevant-paths
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: anthropic
      EMBED_PROVIDER: sentence_transformers
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run golden-set RAGAS evaluation
        run: python eval/run_eval.py

      - name: Upload per-question results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results
          path: eval/results.json
