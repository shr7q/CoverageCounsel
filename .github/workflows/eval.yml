name: RAGAS evaluation gate

# Runs the golden-set eval (eval/run_eval.py) against real Claude for
# generation -- not the local Ollama setup used in day-to-day dev, since a
# hosted runner can't reasonably run a local LLM in CI time. Embeddings run
# locally in-process (sentence_transformers) rather than through a hosted
# API -- free, no key, no rate limits, and the cross-encoder reranker
# already pulls in the same library. Requires ANTHROPIC_API_KEY as a
# repository secret.
#
# Fails the build if mean faithfulness drops below the threshold in
# eval/run_eval.py -- e.g. reverting to dense-only retrieval or breaking the
# reranker should trip this gate.
#
# Scoped to paths that actually affect answer quality. This runs ~300-500
# real Claude calls per invocation (42 questions x several pipeline calls
# each, plus RAGAS's own faithfulness/answer_relevancy scoring calls) -- a
# real cost that a Dockerfile tweak, a GCP auth fix, or a frontend change
# has no business re-triggering. Learned this the expensive way: five
# unrelated infra commits in a row each re-ran the full suite before this
# filter existed.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "eval/**"
      - "db/schema.sql"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "eval/**"
      - "db/schema.sql"
      - "requirements.txt"
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: anthropic
      EMBED_PROVIDER: sentence_transformers
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run golden-set RAGAS evaluation
        run: python eval/run_eval.py

      - name: Upload per-question results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results
          path: eval/results.json
