name: RAGAS evaluation gate

# Runs the golden-set eval (eval/run_eval.py) against the real Claude +
# OpenAI embeddings stack -- not the local Ollama setup used in day-to-day
# dev, since a hosted runner can't reasonably run a local LLM plus the
# cross-encoder reranker plus RAGAS's own scoring calls in CI time. Requires
# ANTHROPIC_API_KEY and OPENAI_API_KEY as repository secrets.
#
# Fails the build if mean faithfulness drops below the threshold in
# eval/run_eval.py -- e.g. reverting to dense-only retrieval or breaking the
# reranker should trip this gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: anthropic
      EMBED_PROVIDER: openai
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run golden-set RAGAS evaluation
        run: python eval/run_eval.py

      - name: Upload per-question results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results
          path: eval/results.json
