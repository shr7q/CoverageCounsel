name: RAGAS evaluation gate

# Runs the golden-set eval (eval/run_eval.py) against real Claude for
# generation -- not the local Ollama setup used in day-to-day dev, since a
# hosted runner can't reasonably run a local LLM in CI time. Embeddings run
# locally in-process (sentence_transformers) rather than through a hosted
# API -- free, no key, no rate limits, and the cross-encoder reranker
# already pulls in the same library. Requires ANTHROPIC_API_KEY as a
# repository secret.
#
# Fails the build if mean faithfulness drops below the threshold in
# eval/run_eval.py -- e.g. reverting to dense-only retrieval or breaking the
# reranker should trip this gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: anthropic
      EMBED_PROVIDER: sentence_transformers
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run golden-set RAGAS evaluation
        run: python eval/run_eval.py

      - name: Upload per-question results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results
          path: eval/results.json
