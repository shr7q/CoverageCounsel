name: Deploy to Cloud Run

# Builds the Dockerfile image and deploys it to Google Cloud Run (project
# project-66080af2-c02c-434f-917, service account github-deploy, keyless
# auth via Workload Identity Federation). Gated on the eval workflow
# (eval.yml) actually passing on main: a regression that fails the RAGAS
# faithfulness/answer_relevancy thresholds blocks the deploy from ever
# running, not just the merge.
#
# Repository secrets required: GCP_WORKLOAD_IDENTITY_PROVIDER,
# ANTHROPIC_API_KEY, DATABASE_URL (hosted Postgres with pgvector --
# Supabase), LANGSMITH_API_KEY.

on:
  # RAG-quality-affecting changes: wait for eval.yml to pass first (see its
  # path filter -- this is the actual "eval gates deploy" relationship).
  workflow_run:
    workflows: ["RAGAS evaluation gate"]
    types: [completed]
    branches: [main]
  # Serving-layer/infra changes: deploy them directly. eval.yml's path
  # filter deliberately excludes api.py/db.py/auth.py/query.py (see its
  # comment) since eval/run_eval.py never imports them, so the workflow_run
  # trigger above would never fire for a change confined to these -- they
  # affect how the service runs and who it lets through, not what it
  # answers, so gating them on the (expensive, real-Claude-calls) eval
  # suite would burn API credits validating something it structurally
  # can't detect.
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements-api.txt"
      - "src/api.py"
      - "src/db.py"
      - "src/auth.py"
      - "src/query.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write  # required for Workload Identity Federation
  contents: read

env:
  GCP_PROJECT_ID: project-66080af2-c02c-434f-917
  GCP_REGION: us-central1
  SERVICE_NAME: healthcare-rag-api
  SERVICE_ACCOUNT: github-deploy@project-66080af2-c02c-434f-917.iam.gserviceaccount.com
  IMAGE: us-central1-docker.pkg.dev/project-66080af2-c02c-434f-917/healthcare-rag/api

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      # `gcloud auth configure-docker`'s credential helper doesn't reliably
      # pick up WIF-derived (External Account) credentials -- a documented
      # gotcha that showed up here as "Unauthenticated request" on push
      # despite auth succeeding. Logging in with the access token this auth
      # step exports (token_format: access_token, above) sidesteps it.
      - name: Log in to Artifact Registry
        run: echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --set-env-vars "EMBED_PROVIDER=sentence_transformers,LLM_PROVIDER=anthropic,RETRIEVAL_MODE=hybrid,VECTOR_STORE=pgvector,RAG_DATA_DIR=real_docs,LANGSMITH_TRACING=true,LANGSMITH_PROJECT=healthcare-rag,ALLOWED_ORIGINS=https://coverage-counsel.vercel.app,CLERK_ISSUER=https://tolerant-rattler-2980.clerk.accounts.dev,ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY,DATABASE_URL=$DATABASE_URL,LANGSMITH_API_KEY=$LANGSMITH_API_KEY"
