name: Deploy to Cloud Run

# Weeks 9-10: builds the Dockerfile image and deploys it to Google Cloud Run.
# Gated on the eval workflow (eval.yml) actually passing on main -- this is
# the literal "CI/CD: eval suite gates deploy on merge to main" plan item.
# A regression that fails the RAGAS faithfulness/answer_relevancy thresholds
# blocks the deploy from ever running, not just the merge.
#
# Dormant until:
#   1. This repo is pushed to GitHub -- done (github.com/shr7q/CoverageCounsel)
#   2. A Google Cloud project exists with Cloud Run + Artifact Registry
#      enabled (project ID: project-66080af2-c02c-434f-917), a
#      github-deploy service account, and Workload Identity Federation set
#      up between them (keyless -- no long-lived JSON key to leak)
#   3. Repository secrets are set: GCP_WORKLOAD_IDENTITY_PROVIDER (the
#      provider's full resource name, ".../workloadIdentityPools/
#      github-actions-pool/providers/<provider-id>"), ANTHROPIC_API_KEY,
#      DATABASE_URL (a hosted Postgres with pgvector -- Supabase or Neon,
#      not this laptop's Docker container), LANGSMITH_API_KEY
#      (embeddings run locally via sentence_transformers -- no OpenAI key
#      needed, see embed_store.py)

on:
  # RAG-quality-affecting changes: wait for eval.yml to pass first (see its
  # path filter -- this is the actual "eval gates deploy" relationship).
  workflow_run:
    workflows: ["RAGAS evaluation gate"]
    types: [completed]
    branches: [main]
  # Infra-only changes: deploy them directly, since eval.yml's path filter
  # means it won't even run for these and the workflow_run trigger above
  # would never fire -- these files change how the service runs, not what
  # it answers, so re-running the (expensive, real-Claude-calls) eval gate
  # would just burn API credits validating something it can't detect.
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements-api.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write  # required for Workload Identity Federation
  contents: read

env:
  GCP_PROJECT_ID: project-66080af2-c02c-434f-917
  GCP_REGION: us-central1
  SERVICE_NAME: healthcare-rag-api
  SERVICE_ACCOUNT: github-deploy@project-66080af2-c02c-434f-917.iam.gserviceaccount.com
  IMAGE: us-central1-docker.pkg.dev/project-66080af2-c02c-434f-917/healthcare-rag/api

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      # `gcloud auth configure-docker`'s credential helper doesn't reliably
      # pick up WIF-derived (External Account) credentials -- a documented
      # gotcha that showed up here as "Unauthenticated request" on push
      # despite auth succeeding. Logging in with the access token this auth
      # step exports (token_format: access_token, above) sidesteps it.
      - name: Log in to Artifact Registry
        run: echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --set-env-vars "EMBED_PROVIDER=sentence_transformers,LLM_PROVIDER=anthropic,RETRIEVAL_MODE=hybrid,VECTOR_STORE=pgvector,RAG_DATA_DIR=real_docs,LANGSMITH_TRACING=true,LANGSMITH_PROJECT=healthcare-rag,ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY,DATABASE_URL=$DATABASE_URL,LANGSMITH_API_KEY=$LANGSMITH_API_KEY"
